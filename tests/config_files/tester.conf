server {
    listen 0.0.0.0:8080;
    server_name localhost;
    client_max_body_size 200M;

    root eval_tests/YoupiBanane;

    location / {
        index youpi.bad_extension;
        allow_methods GET;
    }

    location /directory {
		autoindex on;
		cgi_extension .bla;
		cgi_path ./eval_tests/cgi_tester;
        allow_methods GET POST;
        upload_path ./www/upload;
    }

    location /directory/Yeah {
    	root eval_tests/YoupiBanane/Yeah;
        index youpi.bad_extension;
        allow_methods GET POST;
    }

    location /post_body {
		client_max_body_size 100;
        allow_methods POST;
        upload_path ./www/upload;
    }
}
