server {
    listen 0.0.0.0:8080;
    server_name localhost;
    client_max_body_size 200M;

    root eval_tests/YoupiBanane;

    location / {
        index youpi.bad_extension;
        allow_methods GET;
    }

    location /directory {
		autoindex on;
        allow_methods GET POST;
    }

    location /post_body {
        allow_methods POST;
        upload_path uploads;
    }
}
