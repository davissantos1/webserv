server {
    listen 127.0.0.1:9090;
    client_max_body_size 50M;
    root ./www/test_pages;
    index index.html;

    location / {
        allow_methods GET POST DELETE;
        root ./www/test_pages;
        index index.html;
    }

	# Redireciona tudo de /old-site para /
    location /old-site {
        return 301 ./;
    }

    # CGI para scripts Python
    location /cgi-bin {
        allow_methods GET;
        root ./www/cgi-bin;
		index printEnvironment.py;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    # Define a porta e a interface que o servidor vai escutar
    listen 127.0.0.1:8080;

    # Limite padrão para o tamanho do corpo da requisição
    client_max_body_size 1M;

    # Diretório raiz global do servidor (padrão para todos os locations)
    root ./;

    # Arquivo padrão global do servidor
    index index.html;

    # Configuração da rota raiz (/)
    location / {
        # Métodos aceitos
        allow_methods GET;
		autoindex on;
        index index.html;
    }
	location /cgi-bin {
		cgi_path /usr/bin/python3;
		cgi_extension .py;
		# index printEnvironment.py;
		root ./www/cgi-bin;
	}
	location /return {
		return 301 http://google.com;
	}
	location /upload {
		upload_path www/upload;
	}
}
