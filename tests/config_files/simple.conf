server {
    # Define a porta e a interface que o servidor vai escutar
    listen 127.0.0.1:8080;

    # Limite padrão para o tamanho do corpo da requisição
    client_max_body_size 1M;

    # Diretório raiz global do servidor (padrão para todos os locations)
    root ./www/test_pages;

    # Arquivo padrão global do servidor
    index index.html;

    # Configuração da rota raiz (/)
    location / {
        # Métodos aceitos
        allow_methods GET DELETE;
        index blank.html;
    }
	location /python {
		root ./www/cgi-bin;
		cgi_path /usr/bin/python3;
		cgi_extension .py;
		# index printEnvironment.py;
	}
	location /php {
		root ./www/cgi-bin;
		cgi_path /usr/bin/php;
		cgi_extension .php;
		# index printEnvironment.php;
	}
	location /return {
		return 301 http://google.com;
	}
	location /upload {
		upload_path www/upload;
	}
}
